name: Threadsトークン取得

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "ブラウザで許可した後にコピーした認証コード"
        required: true
        type: string

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: トークン取得
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_REDIRECT_URI: ${{ secrets.THREADS_REDIRECT_URI }}
        run: python get_long_lived_token.py "${{ inputs.auth_code }}"
