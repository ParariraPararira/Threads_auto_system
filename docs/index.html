<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>認証コード受け取りページ</title>
<style>
  body { font-family: sans-serif; padding: 24px; background: #f7f7f7; }
  h1 { font-size: 20px; }
  textarea {
    width: 100%; height: 100px; font-size: 16px; padding: 8px;
    box-sizing: border-box; margin-top: 8px;
  }
  .box { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  button {
    margin-top: 8px; padding: 10px 20px; font-size: 16px;
    background: #06c755; color: white; border: none; border-radius: 6px;
  }
</style>
</head>
<body>
  <h1>認証コード受け取りページ</h1>
  <div class="box">
    <p>下のボックスに、Threadsの認証コードが自動で表示されます。<br>
    「コピー」ボタンを押して、指示された場所に貼り付けてください。</p>
    <textarea id="codeBox" readonly></textarea>
    <br>
    <button onclick="copyCode()">コピー</button>
    <p id="status"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const box = document.getElementById('codeBox');
    if (code) {
      box.value = code;
    } else {
      box.value = '(コードが見つかりませんでした。URLを確認してください)';
    }
    function copyCode() {
      box.select();
      document.execCommand('copy');
      document.getElementById('status').innerText = 'コピーしました！';
    }
  </script>
</body>
</html>
